<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
  <title id="title">M² Calls system overview</title>
  <desc id="description">Browser and Android clients use Firebase identity, a Node and Socket.IO signaling API, Firestore, FCM, SQLite, Blob or local attachment storage, and coturn. Signaling carries SDP and ICE metadata, while DTLS-SRTP media flows directly between peers or through coturn.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222"/>
    </marker>
    <style>
      .boundary { fill: #fff; stroke: #555; stroke-width: 2; stroke-dasharray: 8 6; }
      .client { fill: #e8f1ff; stroke: #173f70; stroke-width: 2; }
      .service { fill: #fff4d6; stroke: #6f4f00; stroke-width: 2; }
      .store { fill: #e8f8ec; stroke: #245c32; stroke-width: 2; }
      .risk { fill: #fff0f0; stroke: #8a1c1c; stroke-width: 2; }
      .heading { font: 700 24px Arial, sans-serif; fill: #111; }
      .label { font: 700 18px Arial, sans-serif; fill: #111; }
      .detail { font: 15px Arial, sans-serif; fill: #111; }
      .edge { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .media { stroke: #173f70; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect x="20" y="20" width="1360" height="880" rx="18" fill="#fafafa" stroke="#111" stroke-width="2"/>
  <text x="700" y="60" text-anchor="middle" class="heading">M² Calls — signaling, media, storage, and trust boundaries</text>

  <rect x="55" y="95" width="360" height="245" rx="16" class="boundary"/>
  <text x="75" y="128" class="label">Public/device trust boundary</text>
  <rect x="85" y="155" width="135" height="125" rx="12" class="client"/>
  <text x="152" y="190" text-anchor="middle" class="label">Web</text>
  <text x="152" y="220" text-anchor="middle" class="detail">React + TypeScript</text>
  <text x="152" y="248" text-anchor="middle" class="detail">browser permissions</text>
  <rect x="250" y="155" width="135" height="125" rx="12" class="client"/>
  <text x="317" y="190" text-anchor="middle" class="label">Android</text>
  <text x="317" y="220" text-anchor="middle" class="detail">Kotlin + Compose</text>
  <text x="317" y="248" text-anchor="middle" class="detail">com.fpvideocalls</text>

  <rect x="455" y="95" width="560" height="560" rx="16" class="boundary"/>
  <text x="475" y="128" class="label">Hosted application boundary</text>
  <rect x="485" y="155" width="205" height="85" rx="12" class="service"/>
  <text x="587" y="190" text-anchor="middle" class="label">Azure SWA</text>
  <text x="587" y="216" text-anchor="middle" class="detail">static web hosting</text>
  <rect x="730" y="155" width="250" height="100" rx="12" class="service"/>
  <text x="855" y="190" text-anchor="middle" class="label">Node + Express + Socket.IO</text>
  <text x="855" y="218" text-anchor="middle" class="detail">REST, signaling, events, TURN issue</text>
  <rect x="485" y="300" width="205" height="105" rx="12" class="risk"/>
  <text x="587" y="337" text-anchor="middle" class="label">In-memory state</text>
  <text x="587" y="365" text-anchor="middle" class="detail">rosters, calls, telemetry</text>
  <text x="587" y="389" text-anchor="middle" class="detail">lost on process restart</text>
  <rect x="730" y="300" width="250" height="105" rx="12" class="store"/>
  <text x="855" y="337" text-anchor="middle" class="label">SQLite</text>
  <text x="855" y="365" text-anchor="middle" class="detail">messages, receipts, rooms</text>
  <text x="855" y="389" text-anchor="middle" class="detail">local durable server file</text>
  <rect x="485" y="455" width="205" height="90" rx="12" class="service"/>
  <text x="587" y="490" text-anchor="middle" class="label">Attachment adapter</text>
  <text x="587" y="518" text-anchor="middle" class="detail">deployment-selected mode</text>
  <rect x="730" y="445" width="115" height="115" rx="12" class="store"/>
  <text x="787" y="487" text-anchor="middle" class="label">Blob</text>
  <text x="787" y="515" text-anchor="middle" class="detail">when</text>
  <text x="787" y="538" text-anchor="middle" class="detail">configured</text>
  <rect x="865" y="445" width="115" height="115" rx="12" class="risk"/>
  <text x="922" y="487" text-anchor="middle" class="label">Local</text>
  <text x="922" y="515" text-anchor="middle" class="detail">uploads</text>
  <text x="922" y="538" text-anchor="middle" class="detail">fallback</text>

  <rect x="1055" y="95" width="290" height="410" rx="16" class="boundary"/>
  <text x="1075" y="128" class="label">Firebase provider boundary</text>
  <rect x="1085" y="155" width="230" height="70" rx="12" class="service"/>
  <text x="1200" y="197" text-anchor="middle" class="label">Authentication</text>
  <rect x="1085" y="255" width="230" height="100" rx="12" class="store"/>
  <text x="1200" y="292" text-anchor="middle" class="label">Firestore</text>
  <text x="1200" y="320" text-anchor="middle" class="detail">profiles, contacts, location,</text>
  <text x="1200" y="344" text-anchor="middle" class="detail">history, private device data</text>
  <rect x="1085" y="385" width="105" height="80" rx="12" class="service"/>
  <text x="1137" y="420" text-anchor="middle" class="label">FCM</text>
  <text x="1137" y="446" text-anchor="middle" class="detail">call alerts</text>
  <rect x="1210" y="385" width="105" height="80" rx="12" class="risk"/>
  <text x="1262" y="416" text-anchor="middle" class="label">Storage</text>
  <text x="1262" y="440" text-anchor="middle" class="detail">present, not</text>
  <text x="1262" y="458" text-anchor="middle" class="detail">primary-proven</text>

  <rect x="1055" y="555" width="290" height="150" rx="16" class="boundary"/>
  <text x="1075" y="588" class="label">TURN VM/network boundary</text>
  <rect x="1100" y="610" width="200" height="65" rx="12" class="service"/>
  <text x="1200" y="640" text-anchor="middle" class="label">coturn</text>
  <text x="1200" y="663" text-anchor="middle" class="detail">STUN / TURN / TURNS</text>

  <path d="M220 190 L485 190" class="edge"/>
  <text x="350" y="178" text-anchor="middle" class="detail">HTTPS static assets</text>
  <path d="M385 220 L730 205" class="edge"/>
  <path d="M220 235 L730 225" class="edge"/>
  <text x="520" y="272" text-anchor="middle" class="detail">HTTPS/WSS API, signaling, events</text>
  <path d="M855 255 L855 300" class="edge"/>
  <path d="M820 255 L635 300" class="edge"/>
  <path d="M800 255 L635 455" class="edge"/>
  <path d="M690 500 L730 500" class="edge"/>
  <path d="M690 520 L865 520" class="edge"/>
  <path d="M385 180 L1085 190" class="edge dashed"/>
  <path d="M385 260 L1085 305" class="edge dashed"/>
  <path d="M980 205 L1085 305" class="edge dashed"/>
  <path d="M980 225 L1085 425" class="edge dashed"/>
  <path d="M315 280 C460 740, 975 740, 1100 650" class="media"/>
  <path d="M155 280 C330 835, 1010 835, 1100 650" class="media"/>
  <path d="M220 300 C470 860, 850 860, 1095 680" class="media dashed"/>
  <text x="690" y="795" text-anchor="middle" class="label">DTLS-SRTP media: direct peer path or coturn relay</text>
  <text x="690" y="830" text-anchor="middle" class="detail">Node signaling sees SDP, ICE metadata, and fingerprints; it does not carry media.</text>
  <text x="690" y="865" text-anchor="middle" class="detail">Red-outlined boxes mark weak, transient, fallback, or not-primary-proven boundaries; labels carry the meaning without color.</text>
</svg>
