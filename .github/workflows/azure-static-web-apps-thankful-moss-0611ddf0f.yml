name: M² Calls trusted web deployment

on:
  workflow_run:
    workflows:
      - M² Calls validation
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: m2-calls-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated web revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Detect application changes
        id: application_changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ -- web .github/workflows/azure-static-web-apps-thankful-moss-0611ddf0f.yml; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and deploy Azure Static Web Apps
        if: steps.application_changes.outputs.should_deploy == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_MOSS_0611DDF0F }}
          action: upload
          app_location: web
          api_location: ""
          output_location: dist
