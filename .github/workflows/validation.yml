name: M² Calls validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and provenance
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run documentation, asset, package, and manifest tests
        run: node --test scripts/tests/*.test.mjs
      - name: Validate portfolio entry points
        run: node scripts/validate-portfolio.mjs .
      - name: Validate historical release receipt
        run: node scripts/validate-release-manifest.mjs docs/releases/mobile-v1.0-receipt.json
      - name: Validate server source package boundary
        run: node scripts/validate-server-package.mjs server

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run default tests
        run: npm test
      - name: Run TURN tests
        run: npm run test:turn
      - name: Run telemetry tests
        run: npm run test:telemetry

  android:
    name: Android tests, lint, and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-kotlin
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Create non-production Firebase client configuration
        shell: bash
        run: |
          python -c 'import json; open("app/google-services.json","w",encoding="utf-8").write(json.dumps({"project_info":{"project_number":"000000000000","project_id":"m2-calls-ci.invalid","storage_bucket":"m2-calls-ci.invalid"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.fpvideocalls"}},"api_key":[{"current_key":"CI_NON_SECRET_PLACEHOLDER_KEY"}]}],"configuration_version":"1"}))'
      - name: Run unit tests
        run: ./gradlew --no-daemon test
      - name: Run Android lint
        run: ./gradlew --no-daemon lint
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

  dependency-review:
    name: New dependency risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject newly introduced high or critical advisories
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
